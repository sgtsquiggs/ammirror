name: CI

on:
  # Other branches get CI through their pull request, so each commit runs once.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its run in progress (each run
# re-checks all of the PR's commits). Pushes to main never cancel each other:
# each checks only the commit messages new since the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit message check needs the history
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      # Runs the pre-commit hooks from prek.toml (ruff, pyright and file
      # hygiene) on all files.
      - uses: j178/prek-action@v3.0.0
      # Runs the commit-msg hook (commitlint) on each new commit.
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/check-commit-messages.sh "$BASE" "$HEAD"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
